[project]
name = "agentic-kie-deploy"
version = "0.1.0"
description = "Serverless, event-driven AWS infrastructure for asynchronous document key-information extraction with LLMs"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "agentic-kie[google]>=0.5.1",
  "aws-lambda-powertools>=3.29",
  "boto3>=1.43.7",
]

[dependency-groups]
dev = [
  "mypy>=1.20.2",
  "nda",
  "pre-commit>=4.6",
  "pyproject-fmt>=2.21.1",
  "pytest>=9.0.3",
  "pytest-cov>=6.1",
  "pytest-timeout>=2.4",
  "ruff>=0.15.12",
  "shellcheck-py>=0.11.0.1",
]

[tool.uv]
sources.nda = { git = "https://github.com/gafnts/kleister-nda-preparation" }

[tool.ruff]
target-version = "py313"
src = [ "src" ]
lint.select = [ "B", "E4", "E7", "E9", "F", "G", "I", "N", "SIM", "UP" ]

[tool.mypy]
mypy_path = "src"
files = [ "src", "tests" ]
strict = true
overrides = [
  { module = "tests.*", disallow_untyped_defs = false, disallow_any_expr = false },
  { module = "boto3", ignore_missing_imports = true },
  { module = "botocore.exceptions", ignore_missing_imports = true },
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.markers = [
  "integration: requires API keys and network access (deselected by default)",
]
ini_options.addopts = "-m 'not integration'"
ini_options.timeout = 120
ini_options.filterwarnings = [
  "ignore::DeprecationWarning:importlib._bootstrap",
]
