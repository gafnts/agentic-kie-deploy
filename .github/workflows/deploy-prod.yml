name: Deploy · Prod

on:
  push:
    branches: [main]
    paths: ["infra/**", "src/extractor/**", ".github/workflows/deploy-prod.yml"]
  pull_request:
    branches: [main]
    paths: ["infra/**", "src/extractor/**", ".github/workflows/deploy-prod.yml"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  ENV: prod
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.0

jobs:
  # PR plan: posts a sticky comment so reviewers can see what would land.
  # Not the plan that gets applied — that one is generated post-merge.
  plan-pr:
    name: Plan (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: terraform -chdir=infra fmt -check -recursive
      - run: make init ENV=${{ env.ENV }}

      - name: Plan
        id: plan
        run: make plan ENV=${{ env.ENV }} 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Capture plan output
        if: always()
        id: planfile
        run: |
          {
            echo 'plan<<EOF'
            head -c 60000 plan.txt
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan
        if: always()
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: terraform-plan-prod
          message: |
            #### Terraform Plan · `prod` ${{ steps.plan.outcome == 'success' && '✅' || '❌' }}
            <details><summary>Show plan</summary>

            ```
            ${{ steps.planfile.outputs.plan }}
            ```
            </details>

      - if: steps.plan.outcome == 'failure'
        run: exit 1

  # Post-merge image push: runs before plan so the digest is available to bake
  # into the saved plan artifact. Uses the prod-plan role (which has targeted
  # ECR push permission) so no environment approval gate is required here.
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect extractor changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            extractor:
              - 'src/extractor/**'

      - name: Configure AWS credentials
        if: steps.changes.outputs.extractor == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: steps.changes.outputs.extractor == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push
        if: steps.changes.outputs.extractor == 'true'
        id: push
        env:
          REPOSITORY: agentic-kie-deploy-${{ env.ENV }}-extractor
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          REPO_URL=$(aws ecr describe-repositories \
            --repository-names "$REPOSITORY" \
            --query 'repositories[0].repositoryUri' \
            --output text)
          docker build -t "$REPO_URL:$IMAGE_TAG" src/extractor/
          docker push "$REPO_URL:$IMAGE_TAG"
          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  # Post-merge plan: generates the saved plan that will be applied.
  # Uploaded as an artifact so the apply job consumes the same bytes.
  # Once the extractor module exists, add -var=extractor_image_digest here
  # using needs.build-and-push.outputs.image_digest.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: build-and-push
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: make init ENV=${{ env.ENV }}
      - run: make ci-plan ENV=${{ env.ENV }} 2>&1 | tee plan.txt

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: |
            infra/tfplan.prod
            plan.txt
          retention-days: 7
          if-no-files-found: error

  # Apply: gated by the `prod` GitHub Environment (manual approval).
  # Consumes the saved plan from the plan job — same bytes that were generated.
  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: plan
    environment: prod
    env:
      I_KNOW: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate backend file
        run: make backend

      - run: make init ENV=${{ env.ENV }}

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod

      - run: make ci-apply ENV=${{ env.ENV }}
